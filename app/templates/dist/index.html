<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>General Agent · 智能会话</title>
    <link rel="icon" type="image/png" href="/assets/sugar-logo.png">
    <link rel="apple-touch-icon" href="/assets/sugar-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>try { var savedTheme = localStorage.getItem('myagent-theme'); document.documentElement.classList.add(savedTheme === 'deep-dark' ? 'theme-dark' : (savedTheme === 'dark' || savedTheme === 'purple' ? 'theme-purple' : 'theme-light')); } catch (e) { document.documentElement.classList.add('theme-light'); }</script>
  <script type="module" crossorigin src="/assets/main-rr6I7sHJ.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-DqOh5k7N.css">
</head>
<body>
<div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar" aria-label="会话列表">
        <div class="sidebar-brand">
            <div class="sidebar-brand-line">
                <div class="sidebar-brand-icon" aria-hidden="true"><img src="/assets/sugar-logo.png" alt="" draggable="false"></div>
                <div class="sidebar-brand-copy">
                    <div class="sidebar-brand-text">General Agent</div>
                    <div class="sidebar-brand-sub" aria-label="Self-Upgrade General Agent Runtime - 自优化通用智能平台" data-ui-tip="Self-Upgrade General Agent Runtime - 自优化通用智能平台" title="Self-Upgrade General Agent Runtime - 自优化通用智能平台">
                        <span class="sidebar-brand-sub-line sidebar-brand-sub-line--en">Self-Upgrade General Agent Runtime</span>
                        <span class="sidebar-brand-sub-line sidebar-brand-sub-line--zh">自优化通用智能平台</span>
                    </div>
                </div>
                <div class="sidebar-brand-actions">
                <button type="button" id="sidebar-settings-btn" class="sidebar-settings-btn" aria-label="界面设置" data-ui-tip="界面设置">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
                <button type="button" id="sidebar-language-btn" class="sidebar-settings-btn sidebar-language-btn" aria-label="切换为英文" data-ui-tip="切换语言" title="切换语言">中/EN</button>
                </div>
            </div>
        </div>
        <div class="sidebar-new-chat-wrap">
            <button id="new-session-btn" type="button" class="new-session-btn" data-ui-tip="新建会话">新建对话</button>
        </div>
            <div id="sessions-list" class="sessions-list" role="listbox"></div>
            <div class="sidebar-runtime" role="status" aria-live="polite">
                <span id="sidebar-runtime-link" class="sidebar-runtime-link">
                    <span class="sidebar-runtime-dot" aria-hidden="true"></span>
                    <span id="sidebar-runtime-status">Runtime 在线</span>
                </span>
                <span id="sidebar-runtime-version" class="sidebar-runtime-version">v4.20260907</span>
            </div>
        </aside>

    <div class="sash" id="sash" role="separator" aria-orientation="vertical" aria-label="拖动调整侧栏宽度" tabindex="0"></div>

    <!-- 主区域 -->
    <section class="main" aria-label="聊天">
        <div class="main-center">
            <div id="human-interaction-banner" class="human-interaction-banner hidden" role="status" aria-live="polite">
                <span class="human-todo-floater-mark" aria-hidden="true">!</span>
                <div class="human-todo-floater-body">
                    <div class="human-todo-floater-title">待处理事项</div>
                    <div class="human-todo-floater-rows">
                        <div class="human-todo-floater-row">
                            <span class="human-todo-row-label">全局待办</span>
                            <span class="human-todo-count" data-scope="global">0 项</span>
                            <span class="human-todo-detail" data-scope="global"></span>
                        </div>
                        <div class="human-todo-floater-row">
                            <span class="human-todo-row-label">当前会话</span>
                            <span class="human-todo-count" data-scope="session">0 项</span>
                            <span class="human-todo-detail" data-scope="session"></span>
                        </div>
                    </div>
                    <button type="button" id="human-interaction-banner-btn" class="human-todo-floater-btn">立即处理</button>
                </div>
            </div>
            <header class="titlebar">
                <div class="breadcrumb">
                    <div class="breadcrumb-title-row">
                        <span id="breadcrumb-text">选择或新建会话</span>
                        <div id="breadcrumb-session-actions" class="breadcrumb-session-actions hidden"></div>
                    </div>
                    <span id="breadcrumb-sub"></span>
                </div>
                <div class="titlebar-right">
                    <button type="button" id="subagent-toggle-btn" class="subagent-toggle-btn hidden" aria-label="Subagent" aria-expanded="false" aria-controls="subagent-dock">
                        Subagent
                        <span id="subagent-toggle-badge" class="subagent-toggle-badge">0</span>
                    </button>
                    <div id="ctx-tokens" class="ctx-wrap" role="status" aria-live="polite">
                        <div class="ctx-row">
                            <span class="ctx-label">— / —</span>
                            <span class="ctx-pct"></span>
                        </div>
                        <span class="ctx-bar" aria-hidden="true"><span class="ctx-fill"></span></span>
                    </div>
                </div>
            </header>

            <div class="workbench">
                <div id="subagent-dock" class="subagent-dock hidden" aria-label="Subagent">
                    <div class="subagent-panel">
                        <div id="subagent-grid" class="subagent-grid"></div>
                        <button type="button" id="subagent-dock-resize" class="subagent-dock-resize" aria-label="展开 Subagent 面板">
                            <span class="subagent-dock-chevron" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
                <div class="chat-stage">
                    <aside id="chat-todo-plan" class="chat-todo-plan" aria-label="会话扩展面板">
                        <div class="chat-todo-plan-inner">
                            <div id="plugin-session-panels" class="plugin-session-panels" hidden></div>
                        </div>
                    </aside>
                    <div id="chat-container" class="chat-container">
                        <div id="chat-stream" class="chat-stream" aria-label="消息"></div>
                    </div>
                    <aside id="chat-toc" class="chat-toc" aria-label="历史记录">
                        <div class="chat-toc-inner">
                            <div class="chat-toc-panel">
                                <div class="chat-toc-title">历史记录</div>
                                <nav id="chat-toc-list" class="chat-toc-list"></nav>
                            </div>
                        </div>
                    </aside>
                    <button type="button" class="panel-edge-handle todo-handle" id="todo-edge-tab" onclick="toggleTodoPlanPanel()" aria-label="折叠会话扩展面板">▶</button>
                    <button type="button" class="panel-edge-handle toc-handle" id="toc-edge-tab" onclick="toggleTocPanel()" aria-label="折叠历史面板">◀</button>
                </div>
            </div>

            <div class="panel" role="form">
                <div class="panel-inner">
                    <div id="subagent-continue-banner" class="subagent-continue-banner hidden" role="status" aria-live="polite">
                        <span class="subagent-continue-banner-msg"></span>
                        <button type="button" id="subagent-continue-btn" class="subagent-continue-banner-btn">继续综合子任务</button>
                        <button type="button" id="subagent-continue-dismiss" class="subagent-continue-dismiss" aria-label="关闭续接提示">×</button>
                    </div>
                    <div id="rewrite-undo-toast" class="rewrite-undo-toast" role="status" aria-live="polite">
                        <span class="rewrite-undo-msg"></span>
                        <button type="button" class="rewrite-undo-btn">撤销</button>
                    </div>
                    <div id="plugin-composer-actions" class="plugin-composer-actions" role="toolbar" aria-label="插件动作" hidden></div>
                    <div class="composer-row">
                        <div class="input-wrapper">
                            <button type="button" id="skill-picker-btn" class="skill-picker-btn" aria-label="选择 Skill" aria-haspopup="dialog" aria-expanded="false" data-ui-tip="选择 Skill"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
                            <textarea id="message-input" rows="1" placeholder="说说你想做什么…（Enter 发送 · Shift/Ctrl/Cmd + Enter 换行）" spellcheck="false" autocomplete="off"></textarea>
                            <button type="button" id="pick-path-btn" class="path-browse-btn path-browse-btn--ghost" aria-label="选择文件" data-ui-tip="选择文件"></button>
                            <button type="button" id="send-btn" data-ui-tip="发送 / 停止">发送</button>
                        </div>
                        <div id="skill-picker-popover" class="skill-picker-popover" role="dialog" aria-label="选择 Skill"></div>
                    </div>
                </div>
                <div class="composer-model-bar" id="model-profile-control">
                    <button type="button" class="composer-model-trigger" id="model-profile-trigger" aria-haspopup="listbox" aria-expanded="false">
                        <span class="composer-model-k">模型</span>
                        <span class="composer-model-v" id="model-profile-current">正在加载模型配置</span>
                        <span class="composer-model-caret" aria-hidden="true"></span>
                    </button>
                    <div class="composer-model-menu" id="model-profile-menu" role="listbox" aria-label="模型配置"></div>
                </div>
                <div class="composer-permission-bar" id="permission-mode-control">
                    <button type="button" class="composer-permission-trigger" id="permission-mode-trigger" aria-haspopup="listbox" aria-expanded="false" title="更改权限" data-ui-tip="更改权限">
                        <svg class="composer-permission-ico" id="permission-mode-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/></svg>
                        <span class="composer-permission-label" id="permission-mode-current">请求批准</span>
                        <span class="composer-permission-caret" aria-hidden="true"></span>
                    </button>
                    <div class="composer-permission-menu" id="permission-mode-menu" role="listbox" aria-label="权限模式">
                        <div class="permission-mode-title">Agent 的操作应如何获得审批？</div>
                        <button type="button" class="permission-mode-option" data-permission-mode="ask_for_approval" role="option">
                            <svg class="permission-mode-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/></svg>
                            <span class="permission-mode-body">
                                <span class="permission-mode-label">请求批准</span>
                                <span class="permission-mode-desc">工作区内写入自动执行；删除、联网、出项目按普通审批</span>
                            </span>
                        </button>
                        <button type="button" class="permission-mode-option" data-permission-mode="approve_for_me" role="option">
                            <svg class="permission-mode-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9.2 11.8l2 2 3.8-4"/></svg>
                            <span class="permission-mode-body">
                                <span class="permission-mode-label">替我审批</span>
                                <span class="permission-mode-desc">低风险自动放行，高风险仍转给你确认</span>
                            </span>
                        </button>
                        <button type="button" class="permission-mode-option" data-permission-mode="full_access" role="option">
                            <svg class="permission-mode-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 7.6-1.6"/><circle cx="12" cy="15" r="1" fill="currentColor"/></svg>
                            <span class="permission-mode-body">
                                <span class="permission-mode-label">完全访问权限</span>
                                <span class="permission-mode-desc">普通操作和工作区删除免审批；高危系统命令仍确认</span>
                            </span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="toast-host" aria-label="操作提示">
                <div id="copy-toast" class="copy-toast" role="status" aria-live="polite">已复制</div>
            </div>
        </div>
    </section>
</div>

<div id="session-offscreen-buffers" class="session-offscreen-buffers" aria-hidden="true"></div>

<div id="ui-modal-root" class="ui-modal-overlay" aria-hidden="true">
    <div class="ui-modal" role="dialog" aria-modal="true" aria-labelledby="ui-modal-title" aria-describedby="ui-modal-desc" tabindex="-1">
        <div class="ui-modal__head">
            <div id="ui-modal-icon" class="ui-modal__icon ui-modal__icon--info" aria-hidden="true"></div>
            <div class="ui-modal__titles">
                <h2 id="ui-modal-title" class="ui-modal__title">提示</h2>
                <p id="ui-modal-subtitle" class="ui-modal__subtitle"></p>
            </div>
        </div>
        <p id="ui-modal-desc" class="ui-modal__body"></p>
        <label id="ui-modal-input-label" class="ui-modal__input-label" for="ui-modal-input" hidden></label>
        <input id="ui-modal-input" class="ui-modal__input" type="text" autocomplete="off" hidden>
        <label id="ui-modal-select-label" class="ui-modal__input-label" for="ui-modal-select-trigger" hidden></label>
        <select id="ui-modal-select" hidden aria-hidden="true" tabindex="-1"></select>
        <div id="ui-modal-select-control" class="ui-modal-select-control" hidden>
            <button id="ui-modal-select-trigger" class="ui-modal-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span class="ui-modal-select-trigger-copy">
                    <span id="ui-modal-select-current" class="ui-modal-select-current"></span>
                    <span id="ui-modal-select-current-meta" class="ui-modal-select-current-meta"></span>
                </span>
                <svg class="ui-modal-select-chevron" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </button>
            <div id="ui-modal-select-menu" class="ui-modal-select-menu" role="listbox" hidden></div>
        </div>
        <div class="ui-modal__actions">
            <span id="ui-modal-input-hint" class="input-shortcut-hint ui-modal__input-hint" hidden>Enter 提交</span>
            <button type="button" class="ui-modal-btn ui-modal-btn--ghost" id="ui-modal-cancel">取消</button>
            <button type="button" class="ui-modal-btn ui-modal-btn--primary" id="ui-modal-ok">确定</button>
        </div>
    </div>
</div>

    <div id="settings-modal-root" class="settings-modal-overlay" aria-hidden="true">
    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title" tabindex="-1">
        <div class="settings-modal__head">
            <h2 id="settings-modal-title" class="settings-modal__title">界面设置</h2>
            <button type="button" id="settings-modal-close" class="settings-modal__close" aria-label="关闭">×</button>
        </div>
        <div class="settings-modal__body">
            <div class="settings-modal__section">
                <div class="settings-modal__label">字体大小</div>
                <div class="settings-font-row" role="group" aria-label="字体大小">
                    <button type="button" id="settings-font-0" class="settings-font-step" aria-label="小号"><span class="settings-font-a settings-font-a--sm" aria-hidden="true">A</span></button>
                    <button type="button" id="settings-font-1" class="settings-font-step" aria-label="标准"><span class="settings-font-a settings-font-a--md" aria-hidden="true">A</span></button>
                    <button type="button" id="settings-font-2" class="settings-font-step" aria-label="大号"><span class="settings-font-a settings-font-a--lg" aria-hidden="true">A</span></button>
                </div>
            </div>
            <div class="settings-modal__section">
                <div class="settings-modal__label">界面风格</div>
                <div class="settings-theme-row" role="group" aria-label="界面风格">
                    <button type="button" id="settings-theme-dark" class="settings-theme-btn">深色</button>
                    <button type="button" id="settings-theme-purple" class="settings-theme-btn">紫色</button>
                    <button type="button" id="settings-theme-light" class="settings-theme-btn">浅色（默认）</button>
                </div>
            </div>
            <div class="settings-modal__section">
                <div class="settings-modal__label">会话目录</div>
                <div class="settings-theme-row" role="group" aria-label="会话目录显示模式">
                    <button type="button" id="settings-session-compact" class="settings-theme-btn">紧凑</button>
                    <button type="button" id="settings-session-detailed" class="settings-theme-btn">详细</button>
                </div>
            </div>
            <div class="settings-modal__section">
                <div class="settings-modal__label">环境与 API</div>
                <button type="button" id="settings-env-advanced" class="settings-advanced-btn">高级设置</button>
                <div style="margin-top:.45rem;color:var(--text-tertiary);font-size:0.72rem;line-height:1.45;">编辑完整 .env，保存后立即写回磁盘（部分项需重启服务）。</div>
                <div style="margin-top:.45rem;color:var(--text-tertiary);font-size:0.72rem;line-height:1.45;">如需帮助或反馈，请联系GitHub @sugarfreeecho</div>
            </div>
            <div id="plugin-settings-sections" class="plugin-settings-sections" hidden></div>
        </div>
    </div>
</div>

</body>
</html>
